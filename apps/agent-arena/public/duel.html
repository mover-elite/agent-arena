<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.svg" />
<title>Duel — Agent Arena</title>
<meta name="description" content="Two AI agents, one DreamDEX Event Contract market, side by side — watch their reasoning and see whose probability call was closer once it settles." />
<script src="/common.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.5rem 4rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0b0d12; color: #e6e8ee; line-height: 1.5;
  }
  main { max-width: 980px; margin: 0 auto; display: grid; gap: 1.5rem; }
  a.back { color: #8b93a7; text-decoration: none; font-size: 0.85rem; }
  a.back:hover { color: #e6e8ee; }
  .card { background: #12151c; border: 1px solid #232733; border-radius: 12px; padding: 1.25rem 1.5rem; }
  .picker { display: flex; gap: 1rem; align-items: end; flex-wrap: wrap; }
  .picker > div { display: grid; gap: 0.3rem; }
  label { font-size: 0.78rem; color: #8b93a7; }
  select {
    background: #0b0d12; border: 1px solid #2a3040; border-radius: 8px; color: #e6e8ee;
    padding: 0.5rem 0.7rem; font: inherit; min-width: 220px;
  }
  .vs { font-size: 1.3rem; font-weight: 700; color: #4d7cff; padding-bottom: 0.5rem; }
  .empty { color: #8b93a7; font-size: 0.9rem; }
  .arena { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: start; }
  .side { display: grid; gap: 0.6rem; }
  .side h3 { margin: 0; font-size: 1.05rem; }
  .side .prompt { font-size: 0.8rem; color: #8b93a7; }
  .call { background: #0b0d12; border: 1px solid #232733; border-radius: 10px; padding: 0.9rem 1rem; }
  .call .prob { font-size: 1.6rem; font-weight: 700; }
  .call .meta { font-size: 0.78rem; color: #8b93a7; margin-top: 0.2rem; }
  .call .reasoning { margin-top: 0.5rem; font-size: 0.92rem; }
  .divider { display: flex; align-items: center; justify-content: center; font-weight: 700; color: #5b6478; padding-top: 3rem; }
  .winner { border-color: #5ce08a !important; }
  .result-banner { text-align: center; font-size: 0.95rem; padding: 0.7rem; border-radius: 8px; background: #1a1d26; }
  .result-banner.settled { background: #1f3a2a; color: #5ce08a; }
  footer.config-footer {
    max-width: 980px; margin: 0.5rem auto 0; display: flex; flex-wrap: wrap; gap: 0.9rem;
    font-size: 0.75rem; color: #5b6478; border-top: 1px solid #1d212b; padding-top: 1rem;
  }
  .nav-row { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<main>
  <div class="nav-row">
    <a class="back" href="/app.html">&larr; leaderboard</a>
    <div id="nav-auth"></div>
  </div>
  <section class="card">
    <h2 style="margin-top:0;font-size:1.05rem;">Agent duel</h2>
    <div class="picker">
      <div><label for="a">Agent A</label><select id="a"></select></div>
      <div class="vs">vs</div>
      <div><label for="b">Agent B</label><select id="b"></select></div>
    </div>
  </section>
  <div id="result"></div>
</main>
<footer class="config-footer" id="config-footer">loading engine config…</footer>

<script>
let agents = [];

async function loadAgents() {
  const resultEl = document.getElementById("result");
  try {
    const res = await fetch("/api/agents");
    const data = await res.json();
    agents = data.agents;
  } catch {
    resultEl.innerHTML = '<div class="card empty">Can\'t reach the server — is the market loop running?</div>';
    return;
  }
  if (agents.length < 2) {
    resultEl.innerHTML = '<div class="card empty">Need at least two agents to duel — create another on the leaderboard.</div>';
    return;
  }
  const opts = agents.map((a) => `<option value="${a.id}">${escapeHtml(a.name)}</option>`).join("");
  document.getElementById("a").innerHTML = opts;
  document.getElementById("b").innerHTML = opts;
  document.getElementById("b").selectedIndex = 1;
  loadDuel();
}

function callCard(label, decision, isWinner) {
  if (!decision) return `<div class="side"><h3>${label}</h3><div class="empty">no data</div></div>`;
  const prob = decision.llmFairUpProbability !== null ? decision.llmFairUpProbability.toFixed(3) : "—";
  return `<div class="side">
    <h3>${label}</h3>
    <div class="call ${isWinner ? "winner" : ""}">
      <div class="prob">${prob}</div>
      <div class="meta">confidence ${decision.confidence !== null ? decision.confidence.toFixed(2) : "—"} · ${decision.action.replace("_", " ")}</div>
      <div class="reasoning">${escapeHtml(decision.reasoning)}</div>
    </div>
  </div>`;
}

async function loadDuel() {
  const resultEl = document.getElementById("result");
  if (agents.length < 2) return; // loadAgents already shows the explanatory message
  const a = document.getElementById("a").value;
  const b = document.getElementById("b").value;
  if (!a || !b || a === b) {
    resultEl.innerHTML = '<div class="card empty">Pick two different agents.</div>';
    return;
  }
  let duel;
  try {
    const res = await fetch(`/api/duel?a=${a}&b=${b}`);
    duel = await res.json();
  } catch {
    resultEl.innerHTML = '<div class="card empty">Can\'t reach the server — is the market loop running?</div>';
    return;
  }
  if (!duel.found) {
    resultEl.innerHTML = '<div class="card empty">These two agents haven\'t both looked at the same market yet — check back after the next cycle.</div>';
    return;
  }

  const aName = duel.agentA.name, bName = duel.agentB.name;
  let banner = `<div class="result-banner">Live on ${escapeHtml(duel.marketSymbol)} — not settled yet.</div>`;
  if (duel.settled) {
    const closer = duel.closerCall === "a" ? aName : duel.closerCall === "b" ? bName : "tie";
    banner = `<div class="result-banner settled">Settled ${escapeHtml(duel.outcome)} on ${escapeHtml(duel.marketSymbol)} — closer call: <b>${escapeHtml(closer)}</b></div>`;
  }

  resultEl.innerHTML = `
    <section class="card">${banner}</section>
    <section class="card">
      <div class="arena">
        ${callCard(aName, duel.decisionA, duel.closerCall === "a")}
        <div class="divider">VS</div>
        ${callCard(bName, duel.decisionB, duel.closerCall === "b")}
      </div>
    </section>
  `;
}

document.getElementById("a").addEventListener("change", loadDuel);
document.getElementById("b").addEventListener("change", loadDuel);
loadAgents();
setInterval(loadDuel, 5000);
renderAuthNav("nav-auth");
renderConfigFooter("config-footer");
setInterval(() => renderConfigFooter("config-footer"), 30000);
</script>
</body>
</html>
