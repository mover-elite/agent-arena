<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Agent Arena">
  <defs>
    <linearGradient id="aaG" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#5ce08a"/>
    </linearGradient>
  </defs>
  <!-- the arena: an octagonal ring -->
  <path d="M22 5 H42 L59 22 V42 L42 59 H22 L5 42 V22 Z"
        fill="none" stroke="url(#aaG)" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- the agent's call: an Up chevron (the 'A') -->
  <path d="M17 41 L32 21 L47 41"
        fill="none" stroke="url(#aaG)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the agent -->
  <circle cx="32" cy="47" r="3.6" fill="url(#aaG)"/>
</svg>
